<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Mã 6 - Bức tranh thứ sáu</title>

<link href="https://fonts.googleapis.com/css2?family=Raleway:wght@400;600&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;}

body{
    font-family:'Raleway',sans-serif;
    background:linear-gradient(135deg,#1e3a8a,#0f172a);
    padding:30px;
}

.container{
    max-width:1000px;
    margin:auto;
    background:white;
    border-radius:16px;
    padding:25px;
    box-shadow:0 15px 35px rgba(0,0,0,0.25);
}

.title{
    text-align:center;
    font-size:26px;
    margin-bottom:20px;
    font-weight:600;
    color:#1e3a8a;
}

.section{
    font-size:18px;
    margin-bottom:15px;
    font-weight:600;
}

.content{
    display:flex;
    gap:25px;
}

.image-box{
    flex:1;
}

.image-box img{
    width:100%;
    border-radius:12px;
    box-shadow:0 6px 18px rgba(0,0,0,0.2);
}

.text-box{
    flex:1;
    background:#f1f5f9;
    padding:18px;
    border-radius:12px;
    border-left:5px solid #1e3a8a;
}

.label{
    font-weight:600;
    margin-bottom:8px;
    color:#1e3a8a;
}

textarea{
    width:100%;
    height:90px;
    margin-top:10px;
    padding:8px;
    border-radius:8px;
    border:1px solid #93c5fd;
    resize:none;
    font-family:'Raleway',sans-serif;
}

button{
    margin-top:10px;
    margin-right:8px;
    padding:7px 14px;
    border:none;
    border-radius:8px;
    cursor:pointer;
    font-weight:600;
}

.hint-btn{
    background:#facc15;
}

.check-btn{
    background:#1e3a8a;
    color:white;
}

.hint-box{
    display:none;
    background:#fef9c3;
    padding:8px;
    border-radius:6px;
    margin-top:8px;
}

.answer{
    display:none;
    background:#fecaca;
    padding:8px;
    border-radius:6px;
    margin-top:8px;
    font-style:italic;
}

.result{
    margin-top:8px;
    font-weight:600;
}

.correct{color:green;}
.wrong{color:red;}

@media(max-width:900px){
    .content{flex-direction:column;}
}
</style>
</head>

<body>

<div class="container">
    <div class="title">Phân tích tranh AI đoạn thơ</div>
    <div class="section">Mã 6: Bức tranh thứ sáu</div>

    <div class="content">
        <div class="image-box">
            <img src="tranh6.jpg" alt="Bức tranh thứ sáu">
        </div>

        <div class="text-box">
            <div class="label">Câu hỏi:</div>
            <p>
                Quan sát hình ảnh trong tranh, em hãy liên hệ và đọc những câu thơ phù hợp trong chương trình Ngữ văn.
            </p>

            <textarea id="userAnswer" placeholder="Nhập câu trả lời..."></textarea>

            <br>
            <button class="hint-btn" onclick="toggleHint()">Gợi ý</button>
            <button class="check-btn" onclick="checkAnswer()">Trả lời</button>

            <div class="hint-box" id="hintBox">
                💡 Hãy liên hệ nội dung bài học tương ứng với hình ảnh trong tranh.
            </div>

            <div class="result" id="result"></div>

            <div class="answer" id="correctAnswer">
                (Bạn có thể chỉnh nội dung đáp án theo yêu cầu của câu 6)
            </div>
        </div>
    </div>
</div>

<script>
function normalize(text){
    return text.toLowerCase().replace(/\s+/g,' ').replace(/[“”"']/g,'').trim();
}

function toggleHint(){
    let hint=document.getElementById("hintBox");
    hint.style.display = hint.style.display==="block" ? "none" : "block";
}

function checkAnswer(){
    let correct=normalize("đáp án của bạn ở đây");
    let user=normalize(document.getElementById("userAnswer").value);
    let result=document.getElementById("result");

    if(user===correct){
        result.innerHTML="✅ Chính xác!";
        result.className="result correct";
    }else{
        result.innerHTML="❌ Kiểm tra lại câu trả lời.";
        result.className="result wrong";
        document.getElementById("correctAnswer").style.display="block";
    }
}
</script>

</body>
</html>
